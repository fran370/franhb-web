name: Importar desde Notion/Substack

on:
  schedule:
    - cron: '0 */3 * * *' # cada 3 horas
  workflow_dispatch: {} # también se puede lanzar a mano desde Actions (o desde el móvil)

permissions:
  contents: write
  actions: write

concurrency:
  group: importar
  cancel-in-progress: false

jobs:
  importar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Configurar git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit actual (antes de importar)
        id: antes
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Crear .env desde los secrets
        run: |
          cat > .env <<EOF
          NOTION_TOKEN=${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID=${{ secrets.NOTION_DATABASE_ID }}
          NOTION_DATABASE_ID_ENTRADAS=${{ secrets.NOTION_DATABASE_ID_ENTRADAS }}
          NOTION_DATABASE_ID_PAGINAS=${{ secrets.NOTION_DATABASE_ID_PAGINAS }}
          EOF

      - name: Importar páginas
        run: npm run importar:paginas

      - name: Importar entradas
        run: npm run importar:entradas -- --forzar

      - name: Importar citas
        run: npm run importar:citas -- --forzar

      # MAweekly ya no se importa aquí: Cloudflare (Substack) devuelve un
      # desafío anti-bot a los runners de GitHub. Lo hace una tarea programada
      # en el PC: scripts/sync-maweekly-local.ps1.

      - name: Publicar
        run: npm run publicar

      - name: Disparar despliegue si hubo cambios
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          despues=$(git rev-parse HEAD)
          if [ "$despues" != "${{ steps.antes.outputs.sha }}" ]; then
            gh workflow run "Publicar en GitHub Pages" --ref main
          else
            echo "Sin cambios, no hace falta desplegar."
          fi
