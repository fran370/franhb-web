name: Probar importación MAweekly (temporal)

on:
  push:
    branches: [claude/epic-bohr-088yd3]

permissions:
  contents: write

jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --silent
      - run: npm run importar:maweekly
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/content/entradas
          git diff --cached --quiet || { git commit -qm "Importa MAweekly desde Substack (prueba en Actions)"; git push origin HEAD:${GITHUB_REF_NAME}; }
