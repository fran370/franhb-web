name: Probar importación MAweekly (temporal)

on:
  push:
    branches: [claude/epic-bohr-088yd3]

jobs:
  probar:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fuente: [feed2json, Feedly]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --silent
      - run: node scripts/importar-maweekly-rss.mjs --forzar
        env:
          MAWEEKLY_FUENTE: ${{ matrix.fuente }}
      - name: Diferencias con lo importado del feed directo
        run: |
          git status --porcelain
          git diff --stat
          git diff -- src/content/entradas/39-2026.md | head -60
          echo ----- 40-2026.md
          head -c 1500 src/content/entradas/40-2026.md || true
      - uses: actions/upload-artifact@v4
        with:
          name: maweekly-${{ matrix.fuente }}
          path: src/content/entradas/40-2026.md
